name: Rust CI

on:
  push:
    branches: [ dev, pest ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.vscode/**'
  pull_request:
    branches: [ master, pest ]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.vscode/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Cargo Test, Clippy and Format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Unsetting this would make so that any malicious package could get our Github Token
          persist-credentials: false
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Cassandra C++ driver
        # This is used by an important pattern written by @stuuupidcat,
        # so we need to install the Cassandra C++ driver on Ubuntu 22.04.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libssl-dev libuv1-dev zlib1g-dev libkrb5-dev
          git clone --depth 1 --branch 2.17.1 https://github.com/apache/cassandra-cpp-driver.git /tmp/cassandra-cpp-driver
          cd /tmp/cassandra-cpp-driver
          cmake -S . -B build -DCASS_BUILD_SHARED=ON -DCASS_BUILD_EXAMPLES=OFF -DCASS_BUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          sudo ldconfig
      - name: Format check
        run: cargo fmt --check
      - name: Test rpl with embedded patterns
        run: cargo test --all
      - name: Test rpl with external patterns (actually the same with embedded ones)
        run: cargo test --all
        env:
          RPL_PATS: docs/patterns-pest
      - name: Run Clippy
        run: cargo clippy -- -D warnings
      - name: Install rpl
        run: cargo install --path . --verbose
      - name: Test installed rpl
        run: cargo rpl --workspace --all-targets --verbose
      # - uses: actions-rust-lang/audit@v1.2.4
