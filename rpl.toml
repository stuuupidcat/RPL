# RPL workspace configuration.
#
# [[ops.<group>]] entries provide concrete instances of abstract op groups
# declared in .rpl pattern files.  Any pattern file that declares
# `ops { <group>[...] = { ... } }` will receive these instances at match time.
#
# The `type = [...]` array names the existential "free" placeholder(s) that
# appear in the binding values.  After eager expansion, `T` and `U` resolve to
# concrete generic paths; `strip_generics_and_split` in the matcher strips the
# `<$1>` brackets and splits on `::` before DefId comparison.

[[ops.sync]]
type = ["$1"]
T    = "std::sync::Mutex<$1>"
U    = "std::sync::MutexGuard<$1>"
lock = "std::sync::Mutex<$1>::lock"

# ---------------------------------------------------------------------------
# Task 14: folded test
# NOTE: There are intentionally NO [[ops.sync_folded]] entries here.
# The cartesian product over an empty instance list yields zero combinations,
# so the ops_folded pattern produces no diagnostics (fold-on-no-instances).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Task 14: partial_bad test — three instances, one malformed (missing unlock)
# ---------------------------------------------------------------------------

[[ops.sync_pb]]
type   = ["$1"]
T      = "std::sync::Mutex<$1>"
U      = "std::sync::MutexGuard<$1>"
lock   = "std::sync::Mutex<$1>::lock"
unlock = "std::sync::MutexGuard<$1>::drop"

[[ops.sync_pb]]
type   = ["$1"]
T      = "parking_lot::Mutex<$1>"
U      = "parking_lot::MutexGuard<$1>"
lock   = "parking_lot::Mutex<$1>::lock"
unlock = "parking_lot::MutexGuard<$1>::drop"

[[ops.sync_pb]]
# missing `unlock` — C3 check should warn and skip this instance
type = ["$1"]
T    = "std::sync::RwLock<$1>"
U    = "std::sync::RwLockReadGuard<$1>"
lock = "std::sync::RwLock<$1>::read"

# ---------------------------------------------------------------------------
# Task 14: set_op_with_ops test
# ---------------------------------------------------------------------------

[[ops.sync_so]]
type   = ["$1"]
T      = "std::sync::Mutex<$1>"
U      = "std::sync::MutexGuard<$1>"
lock   = "std::sync::Mutex<$1>::lock"
unlock = "std::intrinsics::black_box"

# ---------------------------------------------------------------------------
# two_groups test — cartesian product over two op groups.
#   sync_2g:   2 instances (Mutex, RwLock)
#   logger_2g: 1 instance  (std::intrinsics::black_box)
# Total combinations: 2 × 1 = 2.  Only (Mutex, black_box) fires in the test
# body; (RwLock, black_box) has no matching RwLock call site.
# ---------------------------------------------------------------------------

[[ops.sync_2g]]
type = ["$1"]
T    = "std::sync::Mutex<$1>"
U    = "std::sync::MutexGuard<$1>"
lock = "std::sync::Mutex<$1>::lock"

[[ops.sync_2g]]
type = ["$1"]
T    = "std::sync::RwLock<$1>"
U    = "std::sync::RwLockReadGuard<$1>"
lock = "std::sync::RwLock<$1>::read"

[[ops.logger_2g]]
type = ["$1"]
L    = "$1"
log  = "std::intrinsics::black_box"

# ---------------------------------------------------------------------------
# Task 15: CVE-2025-68260 POC — two op groups
#
# sync_cve: models the lock/unlock primitive.
#   lock   = Mutex::lock (stable, non-inlined MIR call site)
#   unlock = std::intrinsics::black_box (opaque sink representing explicit
#            guard consumption; used because MutexGuard::drop is inlined)
#
# intrusive_list_cve: models the intermediate-list transfer/drain operations.
#   transfer_to_temp / drain_temp are free functions defined in the test
#   binary itself.  "crate::" resolves to LOCAL_CRATE in def_path_res, so
#   any binary that defines these two functions at the crate root will match.
# ---------------------------------------------------------------------------

[[ops.sync_cve]]
type   = ["$1"]
L      = "std::sync::Mutex<$1>"
G      = "std::sync::MutexGuard<$1>"
lock   = "std::sync::Mutex<$1>::lock"
unlock = "std::intrinsics::black_box"

[[ops.intrusive_list_cve]]
type             = ["$1", "$2"]
List             = "$1"
TempList         = "$2"
transfer_to_temp = "crate::transfer_to_temp"
drain_temp       = "crate::drain_temp"
